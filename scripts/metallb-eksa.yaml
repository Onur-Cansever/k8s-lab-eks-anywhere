# MetalLB IP pool + L2 advertisement — BU LAB'A ÖZEL ARALIK
# (sistem bileşenleri resmî manifest'ten gelir, bkz. docs/04)
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lab-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.11.210-192.168.11.214
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lab-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - lab-pool
